version: "3.9"
services:
  backend:
    build: ./backend
    container_name: social-backend
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: social-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080